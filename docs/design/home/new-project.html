<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New project</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Courier+Prime:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAFAF9}
a{color:#18181B}a:hover{color:#52525B}
</style>
<div style="min-height: 800px; background: #5F5F66; font-family: Inter, system-ui, sans-serif; color: #18181B; -webkit-font-smoothing: antialiased; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box">
<div role="dialog" aria-modal="true" aria-labelledby="np-title" aria-describedby="np-desc" style="width: 100%; max-width: 500px; background: #FFFFFF; border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 1px rgba(16,16,20,0.08), 0 24px 48px rgba(16,16,20,0.24)">
<div style="padding: 24px 24px 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 id="np-title" style="margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em">New project</h1>
<p id="np-desc" style="margin: 0; font-size: 14px; line-height: 1.5; color: #52525B">A folder for your scripts and character sheets.</p>
</div>
<button type="button" aria-label="Close" style="width: 32px; height: 32px; margin: -4px -6px 0 0; border: 0; border-radius: 8px; background: transparent; color: #52525B; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</button>
</div>

<div style="padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="np-name" style="font-size: 13px; font-weight: 500">Project name</label>
<input id="np-name" type="text" value="Heist" style="height: 40px; padding: 0 12px; border: 1px solid #18181B; border-radius: 8px; font: 400 15px Inter, sans-serif; color: #18181B; box-sizing: border-box; box-shadow: 0 0 0 3px rgba(24,24,27,0.10); outline: none">
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span id="np-loc" style="font-size: 13px; font-weight: 500">Location</span>
<div style="height: 40px; padding: 0 4px 0 12px; border: 1px solid #E4E4E2; border-radius: 8px; display: flex; align-items: center; gap: 10px; box-sizing: border-box">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#52525B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
<span style="flex: 1; font-size: 15px">Scripts</span>
<button type="button" aria-describedby="np-loc" style="height: 30px; padding: 0 10px; border: 1px solid #E4E4E2; border-radius: 6px; background: #FFFFFF; color: #18181B; font: 500 13px Inter, sans-serif; cursor: pointer">Change</button>
</div>
</div>

<div style="border: 1px solid #EDEDEB; background: #FAFAF9; border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 600; color: #52525B">Will be created</span>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; font-family: 'Courier Prime', monospace; font-size: 13px; color: #27272A">
<li style="display: flex; align-items: center; gap: 8px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#71717A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Scripts/Heist/</li>
<li style="display: flex; align-items: center; gap: 8px; padding-left: 22px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#71717A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5"></path></svg>project.json</li>
<li style="display: flex; align-items: center; gap: 8px; padding-left: 22px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#71717A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5"></path></svg>scripts/Heist.fountain</li>
<li style="display: flex; align-items: center; gap: 8px; padding-left: 22px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#71717A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>characters/</li>
</ul>
</div>
</div>

<div style="padding: 14px 24px; background: #FAFAF9; border-top: 1px solid #EDEDEB; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px">
<button type="button" style="height: 38px; padding: 0 14px; border: 1px solid #E4E4E2; border-radius: 8px; background: #FFFFFF; color: #18181B; font: 500 14px Inter, sans-serif; cursor: pointer">Cancel</button>
<button type="button" style="height: 38px; padding: 0 16px; border: 1px solid #18181B; border-radius: 8px; background: #18181B; color: #FFFFFF; font: 500 14px Inter, sans-serif; cursor: pointer">Create project</button>
</div>
</div>
</div>
</body>
</html>
