<html lang="en">

<link rel="preconnect" href="https://fonts.googleapis.com">

<header style="background: #FFFFFF; border-bottom: 1px solid #EBEBE9">
<div style="max-width: 1120px; margin: 0 auto; padding: 0 32px; height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
<div style="display: flex; align-items: center; gap: 10px">
<div style="width: 28px; height: 28px; border-radius: 7px; background: #18181B; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5M9 13h6M9 17h3"></path></svg>

<p style="margin: 0; font-size: 15px; color: #52525B">Recent projects on this computer.</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px">

<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>

<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
</span>

</button>

<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
</button>

<button type="button" style="border: 0; padding: 0; background: transparent; text-align: left; font: inherit; color: inherit; cursor: pointer; display: flex; flex-direction: column">

<span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: #854D0E; background: #FEF9C3; border: 1px solid #FDE68A; border-radius: 999px; padding: 2px 9px">
